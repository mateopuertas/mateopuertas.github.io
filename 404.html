<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Matéo Puertas</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    /* Page autonome : GitHub Pages l'affiche pour n'importe quelle adresse inconnue */
    :root { --ink: #17191c; --bg: #ffffff; --slate: #777b86; --line: #ececec; --g1: #ffb38a; --g4: #d9ccff; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Geist", ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: 24px 16px; overflow: hidden; position: relative; }
    body::before, body::after { content: ""; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; z-index: -1; opacity: .5; }
    body::before { left: -20vmax; top: -25vmax; background: radial-gradient(closest-side, var(--g1), transparent); }
    body::after { right: -22vmax; bottom: -28vmax; background: radial-gradient(closest-side, var(--g4), transparent); }
    .tc { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); display: inline-flex; align-items: center; gap: 8px; }
    .tc i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(56px, 11vw, 150px); line-height: .95; letter-spacing: -0.03em; margin: 24px 0 18px; }
    h1 em { color: var(--slate); }
    p { color: var(--slate); font-size: 18px; margin: 0 0 32px; }
    a { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 9999px; background: var(--ink); color: var(--bg); text-decoration: none; font-size: 16px; }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <span class="tc"><i></i>Erreur 404 · 00:00:04:04</span>
    <h1>Coupé <em>au montage.</em></h1>
    <p>Cette page n'existe pas, ou plus.</p>
    <a href="/">Revenir au portfolio</a>
  </main>
</body>
</html>
